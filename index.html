<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice quiz for Intro to Respiratory Therapy: bedside assessment, ABGs, lab values and breath sounds.">
<title>RT Assessment Quiz Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Layout: one study column — bedside-monitor scoreboard on top, round settings, then the question card. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#13222C; --muted:#56687A; --line:#D3DDE3;
  --accent:#2D6A9F; --accent-soft:#E2EDF6; --accent-ink:#FFFFFF;
  --good:#1D7448; --good-bg:#E2F3E9; --bad:#B03636; --bad-bg:#F9E4E2;
  --mon-bg:#0A1216; --mon-line:#1B2A31; --mon-green:#3BE07C; --mon-cyan:#4FD6EE; --mon-yellow:#F0CF4A; --mon-dim:#6F8791;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#152029; --ink:#E2EAF0; --muted:#94A6B4; --line:#263541;
  --accent:#7DB3E2; --accent-soft:#1B2E3E; --accent-ink:#0E161C;
  --good:#5FCB92; --good-bg:#14301F; --bad:#EE8686; --bad-bg:#3A1C1E;
  --mon-bg:#070D10; --mon-line:#18262C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#152029; --ink:#E2EAF0; --muted:#94A6B4; --line:#263541;
  --accent:#7DB3E2; --accent-soft:#1B2E3E; --accent-ink:#0E161C;
  --good:#5FCB92; --good-bg:#14301F; --bad:#EE8686; --bad-bg:#3A1C1E;
  --mon-bg:#070D10; --mon-line:#18262C; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}

/* Monitor */
.monitor{background:var(--mon-bg);border-radius:var(--r);padding:14px 16px 10px;color:#fff;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.readouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ro{display:flex;flex-direction:column;gap:2px;min-width:0}
.ro .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--mon-dim);text-transform:uppercase}
.ro .val{font-family:var(--f-mono);font-weight:600;font-size:clamp(22px,5vw,30px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .val small{font-size:.5em;color:var(--mon-dim);font-weight:500;margin-left:2px}
.ro.g .val{color:var(--mon-green)} .ro.c .val{color:var(--mon-cyan)} .ro.y .val{color:var(--mon-yellow)}
.pleth{display:block;width:100%;height:34px}
.pleth path{fill:none;stroke:var(--mon-green);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:0;animation:sweep 6s linear infinite}
.pleth .base{stroke:var(--mon-line);stroke-width:1;animation:none}
@keyframes sweep{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.pleth path{animation:none}}

/* Settings */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
summary{cursor:pointer;font-weight:700;font-size:15px;list-style-position:inside}
.settings:not([open]){gap:0}
.row{display:flex;flex-direction:column;gap:8px}
.row-lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.inline{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:var(--bg);color:var(--ink);padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Question card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:3px 8px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stem{font-size:18px;font-weight:600;line-height:1.45;margin:0;text-wrap:pretty}
.items{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px 12px;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;font-size:13px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.opt .mk{font-weight:700;font-size:13px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.right .mk{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt.wrong .mk{color:var(--bad)}
.opt.fade{opacity:.6}
.why{border-radius:8px;padding:12px 14px;border:1px solid var(--line);background:var(--bg)}
.why b{display:block;margin-bottom:2px}
.why.ok b{color:var(--good)} .why.no b{color:var(--bad)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}

/* Results */
.big{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(44px,12vw,64px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.res-table{display:flex;flex-direction:column;gap:10px}
.res-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center}
.res-row .nm{font-size:14px;font-weight:600}
.res-row .sc{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.res-row .track{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.res-row .track i{display:block;height:100%}
.missed-list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.missed-list span{color:var(--good);font-weight:600}

footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.linkish{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.confirm{display:inline-flex;gap:8px;align-items:center}
.confirm button{font:inherit;font-size:13px;border-radius:6px;padding:4px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.confirm .danger{border-color:var(--bad);color:var(--bad)}
@media (max-width:480px){.card{padding:16px}.stem{font-size:17px}.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RT Assessment Quiz Bank</h1>
    <p class="sub" id="sub">Bedside assessment and clinical lab data · Intro to Respiratory Therapy</p>
  </header>

  <section class="monitor" aria-label="Score">
    <div class="readouts">
      <div class="ro g"><span class="lab">Score</span><span class="val" id="m-score">--<small>%</small></span></div>
      <div class="ro c"><span class="lab">Answered</span><span class="val" id="m-ans">0<small>/0</small></span></div>
      <div class="ro y"><span class="lab">Streak</span><span class="val" id="m-streak">0</span></div>
    </div>
    <svg class="pleth" viewBox="0 0 700 34" preserveAspectRatio="none" aria-hidden="true">
      <line class="base" x1="0" y1="28" x2="700" y2="28" stroke="currentColor"/>
      <path id="pleth-path" d=""/>
    </svg>
  </section>

  <details class="settings" id="settings"><summary id="set-sum">Round settings</summary>
    <div class="row">
      <span class="row-lab">Topics</span>
      <div class="chips" id="topics"></div>
    </div>
    <div class="inline">
      <div class="row">
        <span class="row-lab">Questions per round</span>
        <div class="seg" id="size"></div>
      </div>
      <label class="toggle" for="missed-only"><input type="checkbox" id="missed-only"> <span id="missed-label">Only questions I've missed</span></label>
    </div>
    <div><button class="btn" id="start">Start new round</button></div>
  </details>

  <main class="card" id="card" aria-live="polite"></main>

  <footer>
    <span id="bank-count"></span>
    <span id="reset-wrap"><button class="linkish" id="reset">Reset saved progress</button></span>
  </footer>
</div>

<script>
const TOPICS = {
  abg:"ABGs", labs:"Lab values", sounds:"Breath sounds", exam:"Chest exam & inspection",
  vitals:"Vitals & pulse ox", patterns:"Breathing patterns & LOC", history:"History & charting", care:"Patient care & emergencies"
};
/* Each entry: [topic, question, options, explanation, extra]
   The correct option is listed FIRST unless extra.a gives its index (those keep a fixed order). */
const RAW = [
/* ---------- ABGs ---------- */
["abg","What is the normal arterial pH range?",["7.35–7.45","7.25–7.35","7.45–7.55","7.00–7.35"],"Below 7.35 is acidosis; above 7.45 is alkalosis."],
["abg","What is the normal PaCO₂?",["35–45 mm Hg","80–100 mm Hg","22–26 mm Hg","45–55 mm Hg"],"PaCO₂ is 35–45 mm Hg, with 40 as the ideal middle value."],
["abg","What is the normal PaO₂ on room air?",["80–100 mm Hg","35–45 mm Hg","60–70 mm Hg","100–150 mm Hg"],"A PaO₂ below 80 mm Hg on room air means hypoxemia."],
["abg","According to the lecture slides, the normal HCO₃⁻ is:",["22–24 mEq/L","3.5–5.0 mEq/L","35–45 mEq/L","95–105 mEq/L"],"The slides list 22–24 mEq/L. Many textbooks use 22–26."],
["abg","What is the normal base excess (BE)?",["±2 mEq/L","±10 mEq/L","+5 to +10 mEq/L","Always exactly 0"],"Normal base excess is ±2."],
["abg","Which ABG value tells you most directly how well the patient is ventilating?",["PaCO₂","PaO₂","HCO₃⁻","SaO₂"],"Breathing removes CO₂, so PaCO₂ reflects ventilation. PaO₂ reflects oxygenation."],
["abg","Which ABG value is controlled mainly by the kidneys (the metabolic side)?",["HCO₃⁻","PaCO₂","PaO₂","SaO₂"],"The kidneys regulate bicarbonate; the lungs regulate CO₂."],
["abg","ABG: pH 7.25, PaCO₂ 60 mm Hg, HCO₃⁻ 24 mEq/L. This is:",["Respiratory acidosis","Metabolic acidosis","Respiratory alkalosis","Metabolic alkalosis"],"pH is low and PaCO₂ is high (moving opposite ways), so the problem is respiratory. HCO₃⁻ is normal."],
["abg","ABG: pH 7.52, PaCO₂ 28 mm Hg, HCO₃⁻ 23 mEq/L. This is:",["Respiratory alkalosis","Metabolic alkalosis","Respiratory acidosis","Metabolic acidosis"],"pH is high and PaCO₂ is low (opposite directions), so it is respiratory alkalosis."],
["abg","ABG: pH 7.29, PaCO₂ 38 mm Hg, HCO₃⁻ 16 mEq/L. This is:",["Metabolic acidosis","Respiratory acidosis","Metabolic alkalosis","Respiratory alkalosis"],"pH and HCO₃⁻ are both low (moving the same way), so it is metabolic acidosis. PaCO₂ is normal."],
["abg","ABG: pH 7.51, PaCO₂ 43 mm Hg, HCO₃⁻ 33 mEq/L. This is:",["Metabolic alkalosis","Respiratory alkalosis","Metabolic acidosis","Respiratory acidosis"],"pH and HCO₃⁻ are both high (same direction), so it is metabolic alkalosis."],
["abg","After a drug overdose, a patient breathes 6 times a minute with shallow breaths. What would you expect on the ABG?",["PaCO₂ rises → respiratory acidosis","PaCO₂ falls → respiratory alkalosis","HCO₃⁻ falls → metabolic acidosis","No change from normal"],"Hypoventilation lets CO₂ build up, which lowers the pH."],
["abg","An anxious patient breathes 32 times a minute after hearing bad news. The ABG most likely shows:",["Low PaCO₂ — respiratory alkalosis","High PaCO₂ — respiratory acidosis","Low HCO₃⁻ — metabolic acidosis","High HCO₃⁻ — metabolic alkalosis"],"Hyperventilation blows off CO₂, which raises the pH."],
["abg","A patient has been vomiting for three days. Which acid–base problem is most likely?",["Metabolic alkalosis","Metabolic acidosis","Respiratory acidosis","Respiratory alkalosis"],"Vomiting loses stomach acid (along with K⁺ and Cl⁻), leaving extra base."],
["abg","A patient has had severe diarrhea for several days. Which acid–base problem is most likely?",["Metabolic acidosis","Metabolic alkalosis","Respiratory alkalosis","Respiratory acidosis"],"Diarrhea loses bicarbonate from the gut, so the blood becomes acidic."],
["abg","A patient in diabetic ketoacidosis has deep, rapid Kussmaul breathing. Which ABG fits?",["Low pH, low HCO₃⁻, low PaCO₂","High pH, high HCO₃⁻, normal PaCO₂","Low pH, high PaCO₂, normal HCO₃⁻","All values normal"],"Metabolic acidosis (low pH and HCO₃⁻), with the lungs blowing off CO₂ to compensate."],
["abg","Using ROME, in a metabolic acid–base problem the pH and HCO₃⁻:",["Move in the same direction","Move in opposite directions","Do not change","Both always fall"],"ROME: Respiratory = Opposite (pH vs. PaCO₂); Metabolic = Equal (pH and HCO₃⁻ move together)."],
["abg","Which device measures the actual SaO₂ and carboxyhemoglobin level?",["A co-oximeter run on an arterial sample","A pulse oximeter","A spirometer","A capnograph"],"Pulse oximetry only estimates saturation. A co-oximeter on an ABG sample gives the true SaO₂ and HbCO."],
["abg","A patient's PaO₂ is 65 mm Hg on room air. This indicates:",["Hypoxemia","Normal oxygenation","Hypercapnia","Respiratory alkalosis"],"Normal PaO₂ is 80–100 mm Hg; below 80 is hypoxemia. Hypercapnia refers to high CO₂."],
["abg","What is the normal SaO₂ on an ABG?",["98–100%","90–92%","85–90%","75–80%"],"The slides list SaO₂ at 98–100%. Normal SpO₂ by pulse oximetry is 95–100%."],

/* ---------- Lab values ---------- */
["labs","What is the normal hemoglobin (Hb)?",["12–16 g/dL","4–6 g/dL","20–25 g/dL","8–10 g/dL"],"Below this range is anemia; above it is polycythemia."],
["labs","What is the normal hematocrit (Hct)?",["40–50%","20–30%","60–70%","12–16%"],"Hct is the percent of blood volume made up of red cells."],
["labs","What is the normal WBC count?",["5,000–10,000 /mm³","1,000–4,000 /mm³","15,000–20,000 /mm³","150,000–400,000 /mm³"],"Above 10,000 is leukocytosis; below 5,000 is leukopenia."],
["labs","What is the normal RBC count?",["4–6 million /mm³","12–16 million /mm³","1–2 million /mm³","40–50 million /mm³"],"Low = anemia; high = polycythemia."],
["labs","A patient's WBC is 3,200 /mm³. This is:",["Leukopenia, often seen with viral infection","Leukocytosis, often seen with bacterial infection","Polycythemia","Within normal limits"],"Below 5,000 is leukopenia. The slides link it to viral infection."],
["labs","A patient has a fever, yellow-green purulent sputum and a WBC of 16,000 /mm³. This suggests:",["Leukocytosis from a bacterial infection","Leukopenia from a viral infection","Anemia","Polycythemia"],"WBC above 10,000 is leukocytosis, typical of bacterial infection."],
["labs","A long-term COPD patient has an Hb of 19 g/dL and an Hct of 58%. The best explanation is:",["Polycythemia from chronic hypoxemia","Anemia from blood loss","Leukocytosis","These are normal adult values"],"Chronic hypoxemia drives the body to make extra red cells."],
["labs","What is the normal sodium (Na⁺)?",["135–145 mEq/L","3.5–5.0 mEq/L","95–105 mEq/L","22–26 mEq/L"],"Sodium is the major extracellular ion, controlled by the kidneys."],
["labs","A dehydrated patient has a sodium of 151 mEq/L. This is:",["Hypernatremia","Hyponatremia","Hyperkalemia","Within normal limits"],"Above 145 is hypernatremia, usually from dehydration."],
["labs","A CHF patient receiving IV fluids has a sodium of 128 mEq/L. This is:",["Hyponatremia from fluid gain","Hypernatremia from dehydration","Hyperkalemia","Within normal limits"],"Below 135 is hyponatremia. Extra fluid from CHF or IV fluids dilutes the sodium."],
["labs","What is the normal potassium (K⁺) level?",["3.5–5.0 mEq/L","135–145 mEq/L","95–105 mEq/L","22–26 mEq/L"],"Your practice quiz accepted 3.5–5.0 mEq/L. The slides say 3.5–4.5."],
["labs","A patient in kidney failure has a K⁺ of 6.1 mEq/L. This is:",["Hyperkalemia","Hypokalemia","Hypernatremia","Within normal limits"],"The kidneys excrete potassium, so kidney failure lets it build up."],
["labs","A patient who is having trouble weaning from the ventilator has a K⁺ of 2.8 mEq/L. Why does this matter?",["Low K⁺ weakens the respiratory muscles","Low K⁺ increases lung compliance","Low K⁺ causes polycythemia","It does not affect breathing"],"Severe electrolyte problems weaken the respiratory muscles and make spontaneous breathing hard to sustain."],
["labs","What is the normal chloride (Cl⁻)?",["95–105 mEq/L","135–145 mEq/L","3.5–5.0 mEq/L","70–105 mEq/L"],"Chloride is a major extracellular ion."],
["labs","Prolonged vomiting most often causes which chloride change?",["Hypochloremia (low Cl⁻)","Hyperchloremia (high Cl⁻)","No change","Hypernatremia"],"Per the slides: vomiting → low chloride; diarrhea → high chloride."],
["labs","What is the normal BUN?",["8–25 mg/dL","0.7–1.3 mg/dL","70–105 mg/dL","135–145 mg/dL"],"BUN and creatinine are both kidney-function tests."],
["labs","What is the normal blood glucose?",["70–105 mg/dL","8–25 mg/dL","135–145 mg/dL","150–200 mg/dL"],"The slides list 70–105 mg/dL."],
["labs","What is the normal creatinine?",["0.7–1.3 mg/dL","8–25 mg/dL","3.5–5.0 mg/dL","12–16 mg/dL"],"Creatinine is excreted by the kidneys."],
["labs","Which lab value is most specific for kidney failure?",["Creatinine","BUN","Glucose","Chloride"],"The slides call creatinine more specific than BUN for kidney failure."],
["labs","How is hematocrit measured?",["By spinning blood to see what percent is red cells","By counting white cells","With a pulse oximeter","By measuring plasma sodium"],"Spinning separates the cells, and the red-cell layer is read as a percentage."],
["labs","How much O₂ does 1 gram of fully saturated hemoglobin carry?",["1.34 mL","13.4 mL","0.003 mL","4 mL"],"Each gram of Hb carries 1.34 mL of O₂ when fully saturated."],
["labs","An anemic patient has an SpO₂ of 99%, but her tissues may still be short of oxygen. Why?",["There is too little Hb to carry enough O₂, even when it's fully saturated","The pulse oximeter must be broken","Her CO₂ is too high","Her WBC count is high"],"Saturation is a percentage of the Hb present. Low Hb means low O₂ content."],
["labs","When reviewing the chart of a patient with an acute pulmonary infection, which study helps choose the right antibiotic?",["Sputum culture and sensitivity","Electrolyte tests","Hb and Hct","Sputum acid-fast stain"],"C&S identifies the organism and which antibiotics it is sensitive to."],
["labs","A patient has night sweats, weight loss and a chronic cough, and tuberculosis is suspected. Which lab study is most useful?",["Sputum acid-fast stain","Electrolyte tests","Hb and Hct","WBC count"],"Acid-fast testing identifies acid-fast bacteria such as TB."],
["labs","A Gram stain of sputum tells you:",["Whether the organism is gram-positive or gram-negative, and its shape","Exactly which antibiotic will work","Whether the patient has anemia","The patient's clotting time"],"Choosing an antibiotic takes a culture and sensitivity, not a Gram stain."],
["labs","After a sputum sample is stained and acid-washed, the organism resists decolorization. It is classified as:",["An acid-fast bacterium","A gram-negative bacterium","Normal mouth flora","A virus"],"Resisting decolorization after an acid wash defines acid-fast bacteria such as TB."],
["labs","A sputum sample shows many epithelial cells and few pus cells. You should:",["Collect a new sample — this one is mostly saliva","Send it for culture and sensitivity","Chart it as purulent sputum","Order an acid-fast stain"],"A real sputum sample has many pus cells and few epithelial cells."],
["labs","Before drawing an ABG, you see that the platelet count is very low and the INR is high. You should:",["Draw it only if necessary and hold pressure on the site longer","Skip holding pressure afterward","Use a larger needle","Use the femoral artery instead"],"Poor clotting raises the risk of bleeding and a hematoma at the site."],
["labs","Which procedures call for checking clotting values (platelets, PT/INR) first?",["ABG puncture and nasotracheal suctioning","Pulse oximetry and blood pressure","Auscultation and percussion","Temperature and pulse"],"Both procedures can cause bleeding in a patient who clots poorly."],

/* ---------- Breath sounds ---------- */
["sounds","Which breath sound is normal over most of the lung periphery?",["Vesicular","Bronchial","Rhonchi","Crackles"],"Vesicular sounds are soft and low-pitched, heard mostly on inspiration over normal lung."],
["sounds","Which breath sound is normal over the trachea and manubrium?",["Bronchial","Vesicular","Wheezes","Crackles"],"Bronchial sounds are loud and high-pitched. They are normal only over the large airways."],
["sounds","According to the slides, bronchovesicular sounds are normally heard:",["Over the right apex and near the sternum","At the lung bases","Over the lateral chest wall","Only in children"],"They are a mix of bronchial and vesicular sounds, heard near the large airways."],
["sounds","You hear bronchial breath sounds out over the right lower lobe instead of vesicular sounds. This suggests:",["Consolidation, such as pneumonia","Normal lung tissue","Pneumothorax","Emphysema"],"Solid (consolidated) lung carries tracheal sounds out to the chest wall."],
["sounds","A patient having an asthma attack has high-pitched, musical, continuous sounds on exhalation in both lungs. Which term would you record?",["Wheezes","Crackles","Stridor","Rhonchi"],"Wheezes come from narrowed, constricted airways."],
["sounds","Wheezes indicate:",["Narrowed, constricted airways","Fluid in the alveoli","Normal airflow","Upper-airway obstruction"],"Bronchospasm, as in asthma and COPD, causes wheezing."],
["sounds","A patient is wheezing during an asthma exacerbation. What should the RT recommend?",["A bronchodilator such as albuterol","A diuretic such as furosemide","Racemic epinephrine for stridor","An antibiotic"],"Bronchodilators open constricted airways."],
["sounds","Following airway clearance therapy, you hear coarse, low-pitched, continuous sounds around the upper chest. Which term would you record?",["Rhonchi","Wheezes","Crackles","Stridor"],"Rhonchi are continuous, wet or rumbling sounds from secretions in the larger airways."],
["sounds","Rhonchi that clear after the patient coughs tell you:",["Secretions are in the larger airways","There is fluid in the alveoli","There is bronchospasm","The upper airway is blocked"],"A cough moves the secretions, which changes or clears the sound."],
["sounds","A CHF patient has fine crackling sounds, like Rice Krispies in milk, at both lung bases. The most likely cause is:",["Fluid in the lungs (pulmonary edema)","Air trapping","Pneumothorax","Upper-airway obstruction"],"Crackles mean fluid: pulmonary edema, pneumonia or CHF."],
["sounds","During auscultation you hear intermittent bubbling sounds at the lung bases. Which chart entry fits best?",["Crackles heard at the lung bases","Bronchial breath sounds at the lung bases","Wheezes heard at the lung bases","Rhonchi heard at the lung bases"],"Intermittent (discontinuous) bubbling or popping is crackles."],
["sounds","Which adventitious sound is discontinuous (popping) rather than continuous?",["Crackles","Wheezes","Rhonchi","Stridor"],"Crackles pop. Wheezes, rhonchi and stridor are continuous."],
["sounds","Which of these adventitious sounds are continuous?",["1 and 2","2 and 3","2, 3 and 4","1, 2, 3 and 4"],"Wheezes, rhonchi and stridor are continuous. Crackles are discontinuous.",{a:2,items:["Crackles","Wheezes","Rhonchi","Stridor"]}],
["sounds","Crackles are usually heard mainly during:",["Inspiration","Expiration only","Coughing only","Breath-holding"],"Fluid-filled or collapsed small airways pop open as the patient breathes in."],
["sounds","Stridor is heard mainly during:",["Inspiration","Expiration","Neither phase","Only while asleep"],"Stridor is an inspiratory sound from the upper airway. Wheezes are usually on expiration."],
["sounds","A recently extubated patient has a loud, high-pitched sound on inspiration, heard best over the neck. This indicates:",["Upper-airway obstruction — an emergency","Fluid in the alveoli","Normal tracheal breath sounds","Small-airway bronchospasm"],"Stridor means severe upper-airway obstruction."],
["sounds","A child with croup has a barking cough and a high-pitched sound on every inspiration. This sound is:",["Stridor","Wheezes","Crackles","Rhonchi"],"Croup swells the upper airway, which causes inspiratory stridor."],
["sounds","A patient develops stridor after extubation. What treatment would you expect?",["Racemic epinephrine, with reintubation if it is severe","Furosemide","Chest physiotherapy","Lowering the oxygen"],"The slides list racemic epinephrine (Vaponefrin) or intubation for stridor."],
["sounds","Breath sounds are diminished throughout the chest of an emphysema patient. Why?",["Air trapping means little air is moving","Pulmonary edema","Consolidation","This is normal for any adult"],"Hyperinflated lungs move little air, so the sounds are faint and distant."],
["sounds","After chest trauma, there are no breath sounds at all over the left chest. The most likely cause is:",["Pneumothorax","Asthma","Pulmonary edema","Bronchitis"],"Absent breath sounds point to pneumothorax."],
["sounds","Which patient is most likely to have crackles?",["A patient with pneumonia","A patient with an anxiety attack","A patient with pectus carinatum","A patient hyperventilating at rest"],"Pneumonia fills the alveoli with fluid and pus."],

/* ---------- Chest exam & inspection ---------- */
["exam","A patient's sternum is sunken in. This is called:",["Pectus excavatum","Pectus carinatum","Kyphosis","Barrel chest"],"Pectus excavatum is also called funnel chest. It decreases lung volumes."],
["exam","A patient's sternum sticks out, giving a pigeon-chest appearance. This is called:",["Pectus carinatum","Pectus excavatum","Scoliosis","Barrel chest"],"Carinatum means pigeon chest."],
["exam","Which chest deformity decreases lung volumes?",["Pectus excavatum","Pectus carinatum","A normal A-P diameter","A midline trachea"],"Per the slides, excavatum (funnel chest) decreases lung volumes."],
["exam","How does pectus carinatum usually affect breathing?",["It usually causes no respiratory problems","It causes severe restrictive disease","It causes air trapping","It causes a pneumothorax"],"Per the slides, pigeon chest has no respiratory complications."],
["exam","A sideways (lateral) curve of the spine is called:",["Scoliosis","Kyphosis","Pectus carinatum","Barrel chest"],"Scoliosis bends sideways in an S or C shape."],
["exam","A forward hunch of the upper spine (hunchback) is called:",["Kyphosis","Scoliosis","Pectus excavatum","Barrel chest"],"Kyphosis curves forward, rounding the upper back."],
["exam","A spine that curves both forward and sideways is called:",["Kyphoscoliosis","Kyphosis","Scoliosis","Pectus carinatum"],"Kyphoscoliosis combines the two curves."],
["exam","Severe kyphoscoliosis can lead to:",["A restrictive lung defect and respiratory failure","Larger lung volumes","Barrel chest","Digital clubbing within days"],"The deformed chest wall can't expand fully, which restricts the lungs."],
["exam","An increased A-P chest diameter (barrel chest) is most often seen with:",["COPD / emphysema","Pectus carinatum","Pneumonia","Pulmonary edema"],"Air trapping enlarges the front-to-back diameter."],
["exam","What causes barrel chest?",["Air trapping and hyperinflation","Fluid overload","A sideways spinal curve","A sunken sternum"],"Trapped air keeps the chest in a partly inhaled, rounded shape."],
["exam","In a normal adult, the A-P diameter compared with the side-to-side diameter is about:",["1:2","1:1","2:1","1:4"],"Normally the chest is about half as deep as it is wide. In barrel chest it nears 1:1."],
["exam","Percussion over the chest of a COPD patient sounds like a hollow drum. This is called:",["Hyperresonance, from air trapping","Dullness, from consolidation","Flatness, from effusion","Normal resonance"],"Hyperresonance is loud, low-pitched and long, from trapped air."],
["exam","Percussing over an area of pneumonia (consolidation) produces:",["Dullness","Resonance","Hyperresonance","A hollow, drum-like sound"],"Dullness means consolidation or atelectasis."],
["exam","According to the slides, percussion over a pleural effusion produces:",["Flatness","Hyperresonance","Resonance","A hollow, drum-like sound"],"The slides describe flatness as low-pitched and usually heard over pleural effusions."],
["exam","A trauma patient has absent breath sounds and hyperresonance on the left, and the trachea is shifted to the right. The most likely problem is:",["Left pneumothorax","Left lower lobe atelectasis","Right pleural effusion","Left lower lobe pneumonia"],"The trachea shifts away from a pneumothorax."],
["exam","The trachea is shifted toward the right, and percussion over the right lower chest is dull. The most likely problem is:",["Right lower lobe atelectasis","Right pneumothorax","Left pleural effusion","Emphysema"],"The trachea shifts toward atelectasis or fibrosis."],
["exam","On examination of a normal patient's neck, the trachea should be:",["Midline, centered at the suprasternal notch","Shifted to the right","Shifted to the left","Under the left clavicle"],"A normal trachea is midline."],
["exam","In a tension pneumothorax, the trachea shifts:",["Away from the affected side","Toward the affected side","Nowhere","Upward"],"Air pressure pushes the trachea away from a pneumothorax or pleural effusion."],
["exam","To check vocal fremitus, you ask the patient to say:",["\"99\"","\"Ahh\"","Their full name","Nothing, just breathe"],"Saying \"99\" sends vibration through the airways to your hand."],
["exam","Palpating the neck and upper chest, you feel a crackling sensation under the skin. This is:",["Subcutaneous emphysema","Tactile fremitus","Pitting edema","Digital clubbing"],"Subcutaneous emphysema is air trapped under the skin."],
["exam","Which of these is NOT an accessory muscle of ventilation?",["Diaphragm","Sternocleidomastoid","Scalenes","Trapezius"],"The diaphragm is the main muscle of breathing. Accessory muscles are the scalenes, sternocleidomastoid, trapezius and pectoralis."],
["exam","Activity of the accessory muscles of ventilation at rest suggests:",["Increased work of breathing","Increased pulmonary compliance","Decreased airway resistance","Increased physiologic deadspace"],"The patient needs extra muscles just to move air."],
["exam","An infant shows nasal flaring and retractions at rest. This suggests:",["Increased work of breathing","Increased lung compliance","Normal infant breathing","Decreased airway resistance"],"Nasal flaring is the infant's sign of respiratory distress."],
["exam","Jugular venous distention (JVD) indicates:",["Increased venous pressure","Low blood volume","Dehydration","Normal circulation"],"Blood backs up into the neck veins when venous pressure rises."],
["exam","Inspection reveals jugular venous distention. The most likely cause is:",["Right heart failure","Hypovolemia","Pulmonary hypotension","Dehydration"],"A failing right heart can't move blood forward, so it backs up into the veins."],
["exam","JVD is best assessed with the head of the bed at about:",["45°","0° (flat)","90° (fully upright)","Head down (Trendelenburg)"],"At 45° the neck veins of a healthy patient should not look distended."],
["exam","A COPD patient has JVD and 2+ pitting edema in both ankles. The most likely cause is:",["Right heart failure (cor pulmonale)","Hypovolemia","Dehydration","Pulmonary hypotension"],"JVD plus peripheral edema in lung disease points to cor pulmonale."],
["exam","Cor pulmonale is:",["Right heart failure caused by lung disease","Left heart failure caused by a heart attack","A type of lung infection","A collapsed lung"],"Chronic hypoxemia strains the right ventricle until it fails."],
["exam","You press on a patient's ankle and the dent stays. This finding is:",["Pitting edema","Digital clubbing","Cyanosis","JVD"],"Pitting edema is graded 1+, 2+ and so on. Check the feet and hands."],
["exam","On entering a patient's room, you notice that his lips and nail beds are blue-gray. This is a sign of:",["Hypoxemia","Advanced age","Hypercapnia","Peripheral edema"],"Cyanosis is a sign of low oxygen."],
["exam","Cyanosis appears when the blood holds about how much reduced (unoxygenated) hemoglobin?",["5 g/dL","1 g/dL","15 g/dL","Any amount when SpO₂ is below 99%"],"The slides use 5 g of reduced Hb per 100 mL of blood."],
["exam","A severely anemic patient is hypoxemic but does not look cyanotic. Why?",["Too little Hb to reach 5 g/dL of reduced Hb","Anemia makes the skin pink","The pulse oximeter is wrong","Cyanosis requires a high CO₂"],"With little Hb, there isn't enough unoxygenated Hb to turn the skin blue."],
["exam","Compared with a normal patient, cyanosis in a polycythemic COPD patient appears:",["Sooner, at milder hypoxemia","Never","Later, only at severe hypoxemia","Only in the feet"],"Extra Hb means the 5 g/dL of reduced Hb is reached sooner."],
["exam","Digital clubbing looks like:",["Loss of the normal nail-base angle, with a rounded, widened fingertip","Yellow, brittle nails","Swollen knuckles","Pale nail beds that refill quickly"],"In clubbing, the fingertip (DPD) becomes wider than the last joint (IPD)."],
["exam","Digital clubbing is most associated with:",["Cystic fibrosis or bronchiectasis (chronic hypoxemia)","An acute asthma attack","A sprained finger","Acute anxiety"],"Clubbing develops over time with chronic lung or heart disease."],
["exam","When measuring a clubbed finger, you find:",["DPD greater than IPD","IPD greater than DPD","DPD equal to IPD","No measurable change"],"DPD is the depth at the nail base; IPD is the depth at the last finger joint."],
["exam","It is noted in the chart that a patient has a six-second capillary refill time. This indicates the patient:",["Has inadequate perfusion to the extremities","Has pulmonary edema","Has adequate pulmonary perfusion","Has increased cardiac output"],"Normal capillary refill is 2–3 seconds."],
["exam","A patient's capillary refill is 2 seconds. This indicates:",["Normal peripheral perfusion","Poor perfusion to the extremities","Pulmonary edema","Decreased cardiac output"],"Normal is 2–3 seconds."],
["exam","A patient becomes restless and anxious, and his heart rate is climbing. What should you suspect first?",["Hypoxemia","Hypothermia","CO₂ retention","Hyponatremia"],"Restlessness is an early sign of hypoxemia."],
["exam","A COPD patient becomes increasingly sleepy and hard to wake. What should you suspect?",["CO₂ retention (hypercapnia)","Hypoxemia alone","Hyperthermia","Anemia"],"Sleepiness suggests CO₂ retention."],
["exam","When does inspection of the patient begin?",["The moment you walk into the room","After taking vital signs","After auscultation","At discharge"],"Your first look at the patient's color, posture and breathing is part of inspection."],

/* ---------- Vitals & pulse ox ---------- */
["vitals","What is the normal respiratory rate for an adult?",["12–20 /min","20–26 /min","24–34 /min","8–10 /min"],"Child 20–26; infant 24–34."],
["vitals","What is the normal respiratory rate for an infant, per the slides?",["24–34 /min","12–20 /min","20–26 /min","8–12 /min"],"Adult 12–20; child 20–26; infant 24–34."],
["vitals","Which temperature site is most accurate?",["Rectal","Oral","Axillary","Ear"],"Rectal is the most accurate site."],
["vitals","A patient's temperature rises from 37 °C to 39 °C. About how much does his O₂ consumption increase?",["20%","5%","10%","40%"],"O₂ consumption and CO₂ production rise about 10% for every 1 °C."],
["vitals","How does a fever affect heart rate and breathing?",["Both increase","Both decrease","Heart rate rises, breathing slows","Neither changes"],"Higher metabolism means more O₂ use and more CO₂ to remove."],
["vitals","Which term best describes an adult pulse rate of 125 per minute?",["Tachycardia","Bradycardia","Pulsus paradoxus","Pulsus alternans"],"Tachycardia is above 100/min."],
["vitals","Which term best describes an adult pulse of 52/min?",["Bradycardia","Tachycardia","Pulsus alternans","Normal sinus rate"],"Bradycardia is below 60/min."],
["vitals","A COPD patient's pulse gets noticeably weaker each time he inhales. You would chart:",["Pulsus paradoxus","Pulsus alternans","Bounding pulse","Thready pulse"],"Pulsus paradoxus is a weaker pulse on inhalation, common in COPD."],
["vitals","A pulse that alternates strong and weak beats is called:",["Pulsus alternans","Pulsus paradoxus","Bounding pulse","Bradycardia"],"Pulsus alternans is a regular alternation of strong and weak beats."],
["vitals","A patient's pulse is irregular. How long should you count it?",["A full 60 seconds","15 seconds × 4","30 seconds × 2","10 seconds × 6"],"Shorter counts miss the irregular beats."],
["vitals","Why take a pulse with your index and middle fingers instead of your thumb?",["Your thumb has its own pulse, which can confuse the count","The thumb is too weak to feel a pulse","It's an infection-control rule","Only for patient comfort"],"The slides say never to use the thumb."],
["vitals","Blood pressure above which value is hypertension?",["140/90 mm Hg","120/80 mm Hg","100/60 mm Hg","160/110 mm Hg"],"Normal adult BP is 120/80. Per the slides, hypotension is below 95/60."],
["vitals","The systolic pressure mainly reflects:",["Cardiac contractility","Blood vessel resistance","Respiratory rate","Body temperature"],"Systolic is the first number and reflects how hard the heart contracts."],
["vitals","The diastolic pressure mainly reflects:",["Blood vessel resistance","Cardiac contractility","Oxygen saturation","Lung compliance"],"Diastolic is the second number and reflects resistance in the vessels."],
["vitals","A patient's blood pressure is 110/70. What is the mean arterial pressure?",["83 mm Hg","90 mm Hg","70 mm Hg","97 mm Hg"],"(2 × 70 + 110) ÷ 3 = 250 ÷ 3 ≈ 83 mm Hg."],
["vitals","A patient's blood pressure is 130/85. What is the mean arterial pressure?",["100 mm Hg","108 mm Hg","85 mm Hg","115 mm Hg"],"(2 × 85 + 130) ÷ 3 = 300 ÷ 3 = 100 mm Hg."],
["vitals","What is the normal SpO₂ by pulse oximetry?",["95–100%","85–90%","80–85%","100% only"],"Pulse oximetry estimates SaO₂ with light; normal is 95–100%."],
["vitals","Which abnormal hemoglobins make a pulse oximeter overestimate saturation?",["Carboxyhemoglobin and methemoglobin","Fetal and adult hemoglobin","Oxyhemoglobin only","None of these"],"The oximeter reads these as if they were carrying oxygen."],
["vitals","A house-fire victim has an SpO₂ of 99%, a headache and confusion. You should:",["Give 100% O₂ and get an ABG with co-oximetry","Accept the reading — no oxygen is needed","Place him on a 2 L/min nasal cannula","Move the probe to another finger and recheck"],"CO makes pulse oximetry read falsely high."],
["vitals","Carbon monoxide binds to hemoglobin about how much more strongly than oxygen does?",["About 200 times","About 2 times","About 20 times","About 2,000 times"],"CO forms HbCO and pushes oxygen off the hemoglobin."],
["vitals","Carbon monoxide shifts the oxyhemoglobin curve:",["To the left, so less O₂ is released to the tissues","To the right, so more O₂ is released","Not at all","Only during exercise"],"Hb holds on to the oxygen it does carry."],
["vitals","How is carbon monoxide poisoning treated?",["100% FiO₂ or hyperbaric oxygen","A 2 L/min nasal cannula","A diuretic","A bronchodilator"],"High-concentration O₂ speeds the removal of CO from the hemoglobin."],
["vitals","Which of the following can make a pulse oximeter reading unreliable?",["1 and 3","2 and 4","1, 2 and 3","1, 2, 3 and 4"],"Nail polish, poor perfusion, HbCO and movement all affect readings.",{a:3,items:["Dark nail polish","Shock or poor perfusion","Carbon monoxide poisoning","Patient movement"]}],
["vitals","Which are indications for pulse oximetry?",["1 and 2","1, 2 and 3","3 and 4","1, 2, 3 and 4"],"Pulse oximetry estimates oxygen saturation. It cannot measure PaCO₂.",{a:1,items:["Continuous monitoring","Spot checks","Weaning from oxygen and measuring response to O₂ therapy","Measuring PaCO₂"]}],
["vitals","The best quick check that a pulse oximeter reading is believable is to:",["Compare the oximeter's pulse rate with the patient's actual pulse","Turn up the oxygen","Take a blood pressure","Ask the patient how they feel"],"If the pulse rates don't match, the reading is suspect. Also ask whether the numbers make sense."],
["vitals","Spectrophotometry in a pulse oximeter measures:",["How much light the hemoglobin absorbs","Arterial blood pressure","CO₂ levels","Body temperature"],"Oxygenated and unoxygenated Hb absorb different wavelengths of light."],

/* ---------- Breathing patterns & LOC ---------- */
["patterns","A patient says he has trouble sleeping unless he uses two pillows. This indicates:",["Orthopnea","Dysphagia","Platypnea","Tachypnea"],"Orthopnea is dyspnea lying flat, relieved by sitting up."],
["patterns","A patient says he can only breathe comfortably sitting upright and now sleeps in a recliner. Which term should you chart?",["Orthopnea","Platypnea","Dysphagia","Tachypnea"],"Orthopnea is dyspnea lying flat."],
["patterns","A patient gets short of breath when she sits up, and it eases when she lies flat. This is:",["Platypnea","Orthopnea","Paroxysmal nocturnal dyspnea","Hyperpnea"],"Platypnea is the reverse of orthopnea."],
["patterns","Paroxysmal nocturnal dyspnea is most associated with:",["CHF, COPD and asthma","Pectus carinatum","Scoliosis","Anemia"],"The patient wakes suddenly at night short of breath."],
["patterns","Kussmaul's breathing is a pattern seen in which type of patient?",["Diabetic ketoacidosis patients","Congestive heart failure patients","Pulmonary edema patients","Emphysema patients"],"Kussmaul breathing is deep and rapid, to blow off CO₂ in metabolic acidosis."],
["patterns","Deep, rapid Kussmaul breathing is the body's attempt to:",["Blow off CO₂ to make up for metabolic acidosis","Retain CO₂","Increase oxygen stores","Make up for metabolic alkalosis"],"Lowering PaCO₂ pushes the pH back up."],
["patterns","Breathing gradually gets faster and deeper, then shallower, followed by a period of apnea. This pattern is:",["Cheyne-Stokes","Kussmaul's","Biot's","Eupnea"],"Cheyne-Stokes is a cyclic rise and fall with apnea."],
["patterns","Biot's breathing is best described as:",["Irregular breaths with sudden periods of apnea","Deep, rapid and regular breathing","A smooth crescendo–decrescendo cycle","Normal breathing"],"Biot's breathing is irregular, unlike the smooth cycles of Cheyne-Stokes."],
["patterns","Which of these commonly causes tachypnea?",["Hypoxemia, pain, anxiety or fever","An opioid overdose","Hypothermia","Deep sleep"],"Each of these raises the drive to breathe."],
["patterns","Which of these commonly causes bradypnea?",["CNS depression, such as a drug overdose","Fever","Anxiety","Exercise"],"Hypothermia also slows breathing."],
["patterns","Hypopnea means:",["Shallow breathing","Deep breathing","No breathing","Fast breathing"],"Hyperpnea is deep breathing; apnea is no breathing."],
["patterns","Hyperpnea means:",["Deep breathing","Shallow breathing","Absent breathing","Slow breathing"],"Hypopnea is shallow breathing; apnea is no breathing."],
["patterns","Pursed-lip breathing is most often seen in:",["COPD","Pneumothorax","Pectus carinatum","Anemia"],"Breathing out against pursed lips helps keep the airways open."],
["patterns","A patient is sleepy but wakes easily when you say his name. His level of consciousness is:",["Lethargic","Obtunded","Stuporous","Comatose"],"Lethargic means sleepy but arouses easily."],
["patterns","A patient wakes only with difficulty. His level of consciousness is:",["Obtunded","Lethargic","Delirious","Confused"],"Obtunded means awakens with difficulty."],
["patterns","A patient does not wake up but does respond to painful stimuli. His level of consciousness is:",["Stuporous","Lethargic","Obtunded","Comatose"],"Comatose patients don't respond to any stimulus."],
["patterns","An agitated patient is having hallucinations. His level of consciousness is:",["Delirious","Lethargic","Obtunded","Stuporous"],"Confused means incoherent thoughts; delirious adds agitation and hallucinations."],
["patterns","A patient who is unconscious and does not respond to any stimulus is:",["Comatose","Stuporous","Obtunded","Lethargic"],"Comatose is the deepest level."],
["patterns","It is written in the chart that the patient is awake, alert and oriented × 3. This means that:",["You asked the patient their name, place and what date it is","You asked the same question three times","The patient said their name three times","The patient answered three of five questions"],"Oriented × 3 means oriented to person, place and time."],
["patterns","A patient knows her name and that she is in the hospital, but not today's date. You would chart her as:",["Oriented × 2","Oriented × 1","Oriented × 3","Delirious"],"She is oriented to person and place, but not time."],

/* ---------- History & charting ---------- */
["history","Where in the medical record would you find a patient's understanding of the drugs they take and how they're given?",["Medication record","Progress notes","Doctor's orders","Admission/demographics"],"The medication record tracks a patient's drugs and how they are given."],
["history","Where in the medical record would you find the physician's prescription for a patient's oxygen therapy?",["Doctor's orders","Progress notes","Medication record","Admission/demographics"],"Every prescribed therapy, including O₂, is in the doctor's orders."],
["history","Where in the medical record would you find a patient's date of birth, address and insurance?",["Admission/demographics","Doctor's orders","Progress notes","Medication record"],"Demographic data covers name, age, date of birth, height, weight and similar details."],
["history","The progress notes contain:",["Ongoing notes on the patient's condition and response to treatment","Insurance information","Only the drug list","Only the physician's prescriptions"],"Progress notes show how the patient is doing over time."],
["history","A patient's chief complaint is:",["The main reason the patient is seeking care, usually one sentence","The doctor's final diagnosis","The patient's past surgeries","The most abnormal lab value"],"For example: \"I came because I'm having trouble breathing.\""],
["history","In a patient history, HPI stands for:",["History of present illness","Hospital patient index","Hypoxemia, pain, infection","Health and physical inspection"],"PMH is past medical history."],
["history","Which part of a patient's social history matters most when assessing lung disease?",["Smoking history","Marital status","Cultural background","Education"],"Smoking is the top risk factor for lung disease."],
["history","Which part of a patient's history is most important in diagnosing work-related lung disease?",["Occupational history","Marital status","Cultural background","Education"],"Dusts, fumes and chemicals at work can cause lung disease."],
["history","Which of the following is a sign rather than a symptom?",["Cyanosis","Nausea","Chest pain","Shortness of breath"],"A sign is objective and observable; a symptom is reported by the patient."],
["history","Dyspnea is:",["Subjective — what the patient reports","An objective sign","Measured by pulse oximetry","Always visible from the doorway"],"Dyspnea is a symptom, so you evaluate whether it is present and how bad it is."],
["history","Which four qualities of sputum must you always chart?",["Amount, odor, viscosity, color","Amount, pH, temperature, color","Odor, taste, volume, smell","Color, weight, culture, stain"],"Always include all four in your charting."],
["history","A patient coughs up pink, frothy sputum. This suggests:",["Pulmonary edema","Normal sputum","An asthma attack","Chronic bronchitis"],"Pink, frothy sputum is a classic sign of pulmonary edema."],
["history","A patient coughs up blood-tinged sputum. What should you do?",["Notify the nurse and the physician","Chart it only","Ignore it if the amount is small","Give a bronchodilator"],"Report hemoptysis or any blood."],
["history","When analyzing a symptom, asking \"On a scale of 1 to 10, how bad is it?\" measures:",["Severity","Onset","Location","Timing"],"The full list is onset, characteristics, location, severity, timing and aggravating or relieving factors."],
["history","A patient complains of chest pain. Which would you ask about?",["1 and 2","1, 2 and 3","2, 3 and 4","1, 2, 3 and 4"],"Analyze a symptom by onset, characteristics, location, severity, timing and aggravating or relieving factors.",{a:3,items:["Onset","Location","Severity on a 1–10 scale","What makes it better or worse"]}],
["history","During an interview, a patient complains about coughing. What further information would you seek?",["1 and 2","2 and 3","1, 2 and 3","1 and 3"],"Ask about onset, the cough's characteristics (productive or not) and how it has changed over time.",{a:2,items:["Onset (what brings it on?)","Characteristics (is it productive?)","Course (how has it progressed over time?)"]}],

/* ---------- Patient care & emergencies ---------- */
["care","RR, tidal volume, chest movement, breath sounds and PaCO₂ are used to assess which critical life function?",["Ventilation","Oxygenation","Circulation","Perfusion"],"Ventilation is moving air into and out of the lungs."],
["care","Heart rate, skin color, sensorium and PaO₂ are used to assess which critical life function?",["Oxygenation","Ventilation","Circulation","Perfusion"],"Oxygenation is getting O₂ into the blood."],
["care","Blood pressure, temperature, urine output and sensorium are used to assess which critical life function?",["Perfusion","Ventilation","Oxygenation","Circulation"],"Perfusion is getting blood and O₂ into the tissues."],
["care","Pulse rate, pulse strength and cardiac output are used to assess which critical life function?",["Circulation","Perfusion","Oxygenation","Ventilation"],"Circulation is moving the blood through the body."],
["care","The RT has an order for a bronchodilator by SVN. The patient is lethargic, with an RR of 6/min and a heart rate of 160/min with a weak pulse. What should the therapist do FIRST?",["Activate the emergency medical team","Obtain an arterial blood gas","Increase the O₂ to 5 L/min and monitor with pulse oximetry","Recommend a chest radiograph"],"A failing critical life function is treated stat."],
["care","You find a patient gray, gasping and not responding to your voice. What should you do FIRST?",["Call for help and support ventilation","Draw an ABG","Order a chest X-ray","Finish charting"],"Problems with ventilation or oxygenation come before any diagnostic test."],
["care","You arrive to give a scheduled treatment and find the patient unresponsive, not breathing, with no pulse. You should FIRST:",["Call a code and start CPR","Give the ordered treatment","Obtain an arterial blood gas","Increase the O₂ and recheck in 5 minutes"],"No pulse and no breathing means a code: call it and start CPR."],
["care","A patient in cardiogenic shock has a blood pressure of 72/40. Which medication should the RT recommend?",["Dopamine (Intropin)","Lidocaine (Xylocaine)","Nitroprusside (Nipride)","Furosemide (Lasix)"],"Dopamine raises blood pressure. Nitroprusside and furosemide would lower it."],
["care","A patient in cardiogenic pulmonary edema has bilateral crackles and a BP of 150/90. Which medication should the RT recommend to remove the excess fluid?",["Furosemide (Lasix)","Dopamine (Intropin)","Lidocaine (Xylocaine)","Albuterol"],"Furosemide is a diuretic. Dopamine is for low blood pressure."],
["care","To assess what a patient learned after an education session, you would:",["Have the patient explain the information back to you","Ask the assigned nurse to quiz the patient","Check the progress notes for improvement","Give the patient a pamphlet"],"Teach-back shows what the patient actually understood."],
["care","After teaching a patient to use a metered-dose inhaler, the best way to confirm what she learned is to:",["Have her demonstrate the technique back to you","Ask whether she has any questions","Give her a pamphlet to read","Ask the nurse to check on her later"],"A return demonstration proves she can actually do it."],
["care","The RT should recommend which of the following to a patient with COPD to manage his disease?",["1 and 2","3 and 4","1, 3 and 4","2, 3 and 4"],"Flu shots, quitting smoking and β₂ agonists for flare-ups all help. Patients should stay active, not minimize exercise.",{a:2,items:["Annual flu vaccination","Minimizing exercise","A smoking cessation program","β₂ agonists for acute exacerbations"]}],
["care","Which of these help a patient manage COPD?",["1 and 4","2 and 3","1, 2 and 3","2, 3 and 4"],"Exercise, vaccines and quitting smoking help. Avoiding activity leads to deconditioning.",{a:2,items:["Pulmonary rehab and regular exercise","Flu and pneumococcal vaccines","Quitting smoking","Avoiding all physical activity"]}],
["care","When taking a patient's pulse, why is it best not to announce that you're counting?",["The patient may change their breathing or heart rate if they know","It is against hospital policy","It wastes time","Patients find it rude"],"Patients who know they're being watched often change their rate without meaning to."],
];

const BANK = RAW.map((r,i)=>{const x=r[4]||{};return {id:i,t:r[0],q:r[1],o:r[2],why:r[3],a:x.a??0,items:x.items||null,fixed:x.a!==undefined}});
const LET = ["A","B","C","D","E"];
const KEY = "rt-quiz-v1";

/* ---------- storage (per-viewer convenience only) ---------- */
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({hist:S.hist,topics:[...S.topics],size:S.size,missedOnly:S.missedOnly,round:S.round}))}catch(e){}}

const saved = (window.claude?.hot?.data) || load();
const S = {
  hist: saved.hist || {},
  topics: new Set(saved.topics && saved.topics.length ? saved.topics : Object.keys(TOPICS)),
  size: saved.size ?? 20,
  missedOnly: !!saved.missedOnly,
  round: saved.round || null,
};
window.claude?.hot?.snapshot?.(()=>({hist:S.hist,topics:[...S.topics],size:S.size,missedOnly:S.missedOnly,round:S.round}));

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return BANK.filter(q=>S.topics.has(q.t)&&(!S.missedOnly||S.hist[q.id]===0))}
function newRound(ids){
  if(!ids){const p=shuffle(pool());ids=(S.size==="all"?p:p.slice(0,S.size)).map(q=>q.id)}
  const perm={};ids.forEach(id=>{const q=BANK[id];const idx=q.o.map((_,k)=>k);perm[id]=q.fixed?idx:shuffle(idx)});
  S.round={ids,i:0,picks:{},perm,streak:0,best:0};save();render();
}

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")n.className=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v)}kids.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));return n};

function renderSettings(){
  const box=$("#topics");box.textContent="";
  const allOn=S.topics.size===Object.keys(TOPICS).length;
  box.append(el("button",{class:"chip","aria-pressed":String(allOn),onclick:()=>{S.topics=new Set(allOn?[]:Object.keys(TOPICS));save();renderSettings()}},"All topics",el("span",{class:"n"},String(BANK.length))));
  for(const[k,v]of Object.entries(TOPICS)){
    const n=BANK.filter(q=>q.t===k).length;
    box.append(el("button",{class:"chip","aria-pressed":String(S.topics.has(k)&&!allOn),onclick:()=>{
      if(allOn)S.topics=new Set([k]);else{S.topics.has(k)?S.topics.delete(k):S.topics.add(k)}
      if(!S.topics.size)S.topics=new Set(Object.keys(TOPICS));save();renderSettings()}},v,el("span",{class:"n"},String(n))));
  }
  const seg=$("#size");seg.textContent="";
  [10,20,50,"all"].forEach(v=>seg.append(el("button",{"aria-pressed":String(S.size===v),onclick:()=>{S.size=v;save();renderSettings()}},v==="all"?"All":String(v))));
  const missed=BANK.filter(q=>S.topics.has(q.t)&&S.hist[q.id]===0).length;
  $("#missed-only").checked=S.missedOnly;
  $("#missed-label").textContent=`Only questions I've missed (${missed})`;
  const p=pool().length;
  $("#start").textContent=p?`Start new round · ${S.size==="all"?p:Math.min(S.size,p)} questions`:"Start new round";
  $("#start").disabled=!p;
  $("#set-sum").textContent=`Round settings · ${S.topics.size===Object.keys(TOPICS).length?"All topics":S.topics.size+" topic"+(S.topics.size>1?"s":"")} · ${S.size==="all"?"All":S.size} questions${S.missedOnly?" · missed only":""}`;
  $("#bank-count").textContent=`${BANK.length} questions in the bank · progress is saved in this browser`;
}

function renderMonitor(){
  const r=S.round;let ans=0,ok=0;
  if(r){for(const id of r.ids){if(id in r.picks){ans++;if(r.picks[id]===BANK[id].a)ok++}}}
  $("#m-score").innerHTML=(ans?Math.round(ok/ans*100):"--")+"<small>%</small>";
  $("#m-ans").innerHTML=ans+"<small>/"+(r?r.ids.length:0)+"</small>";
  $("#m-streak").textContent=r?r.streak:0;
}

function renderQuestion(){
  const r=S.round,card=$("#card");card.textContent="";
  const id=r.ids[r.i],q=BANK[id],picked=r.picks[id],done=picked!==undefined;
  card.append(
    el("div",{class:"meta"},el("span",{class:"qnum"},`Question ${r.i+1} of ${r.ids.length}`),el("span",{class:"tag"},TOPICS[q.t])),
    el("div",{class:"bar"},el("i",{style:`width:${(r.i+(done?1:0))/r.ids.length*100}%`})),
    el("p",{class:"stem"},q.q)
  );
  if(q.items)card.append(el("ol",{class:"items"},q.items.map(t=>el("li",{},t))));
  const opts=el("div",{class:"opts",role:"group","aria-label":"Answer choices"});
  r.perm[id].forEach((orig,pos)=>{
    let cls="opt",mark="";
    if(done){if(orig===q.a){cls+=" right";mark="Correct"}else if(orig===picked){cls+=" wrong";mark="Your answer"}else cls+=" fade"}
    const b=el("button",{class:cls,id:`opt-${pos}`,onclick:()=>pick(pos)},el("span",{class:"k"},LET[pos]),el("span",{},q.o[orig]),el("span",{class:"mk"},mark));
    if(done)b.disabled=true;opts.append(b);
  });
  card.append(opts);
  if(done){
    const ok=picked===q.a,ansPos=r.perm[id].indexOf(q.a);
    card.append(el("div",{class:"why "+(ok?"ok":"no")},el("b",{},ok?"Correct.":`Not quite. The answer is ${LET[ansPos]}.`),q.why));
  }
  const last=r.i===r.ids.length-1;
  card.append(el("div",{class:"actions"},
    el("span",{class:"hint"},done?"Press Enter for the next question":"Press A–D or 1–4 to answer"),
    el("div",{style:"display:flex;gap:8px"},
      r.i>0?el("button",{class:"btn ghost",id:"prev",onclick:()=>{r.i--;save();render()}},"Back"):null,
      el("button",{class:"btn",id:"next",onclick:next,...(done?{}:{disabled:""})},last?"See results":"Next question"))
  ));
}

function renderResults(){
  const r=S.round,card=$("#card");card.textContent="";
  let ok=0;const by={};const missed=[];
  r.ids.forEach(id=>{const q=BANK[id],good=r.picks[id]===q.a;if(good)ok++;else missed.push(id);(by[q.t]??={n:0,ok:0});by[q.t].n++;if(good)by[q.t].ok++});
  const pct=Math.round(ok/r.ids.length*100);
  card.append(el("div",{class:"meta"},el("span",{class:"qnum"},"Round complete"),el("span",{class:"tag"},`Best streak ${r.best}`)));
  card.append(el("p",{class:"big"},`${ok}/${r.ids.length}`));
  card.append(el("p",{style:"margin:0;color:var(--muted)"},`${pct}% correct. ${pct>=90?"Exam-ready on these topics.":pct>=75?"Solid — review the misses below.":"Go back over the Need to know section, then retry your misses."}`));
  const t=el("div",{class:"res-table"});
  Object.entries(by).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).forEach(([k,v])=>{
    const p=v.ok/v.n;
    t.append(el("div",{class:"res-row"},el("span",{class:"nm"},TOPICS[k]),el("span",{class:"sc"},`${v.ok}/${v.n}`),
      el("div",{class:"track"},el("i",{style:`width:${p*100}%;background:${p>=.8?"var(--good)":p>=.6?"var(--accent)":"var(--bad)"}`}))));
  });
  card.append(t);
  if(missed.length){
    card.append(el("div",{class:"row-lab"},"Review your misses"));
    card.append(el("ol",{class:"missed-list"},missed.map(id=>{const q=BANK[id];return el("li",{},q.q," ",el("span",{},"→ "+q.o[q.a]))})));
  }
  card.append(el("div",{class:"actions"},
    el("span",{class:"hint"},""),
    el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},
      missed.length?el("button",{class:"btn ghost",id:"retry",onclick:()=>newRound(shuffle(missed))},`Retry ${missed.length} missed`):null,
      el("button",{class:"btn",id:"again",onclick:()=>newRound()},"New round"))));
}

function renderEmpty(){
  const card=$("#card");card.textContent="";
  card.append(el("p",{class:"stem"},"No questions match these settings."),
    el("p",{style:"margin:0;color:var(--muted)"},S.missedOnly?"You haven't missed anything in these topics yet. Turn off \"Only questions I've missed\" to practice everything.":"Pick at least one topic above."));
}

function render(){
  renderSettings();renderMonitor();
  const r=S.round;
  if(!r||!r.ids.length)return renderEmpty();
  if(r.i>=r.ids.length)return renderResults();
  renderQuestion();
}

function pick(pos){
  const r=S.round,id=r.ids[r.i];if(r.picks[id]!==undefined)return;
  const orig=r.perm[id][pos];r.picks[id]=orig;const ok=orig===BANK[id].a;
  S.hist[id]=ok?1:0;r.streak=ok?r.streak+1:0;r.best=Math.max(r.best,r.streak);
  save();render();$("#next")?.focus();
}
function next(){const r=S.round;if(r.picks[r.ids[r.i]]===undefined)return;r.i++;save();render();window.scrollTo({top:$("#card").offsetTop-12,behavior:"smooth"})}

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const r=S.round;if(!r||r.i>=r.ids.length)return;
  const k=e.key.toUpperCase();let pos=LET.indexOf(k);if(pos<0&&/^[1-5]$/.test(k))pos=+k-1;
  const id=r.ids[r.i];
  if(pos>=0&&pos<BANK[id].o.length&&r.picks[id]===undefined){e.preventDefault();pick(pos)}
  else if((e.key==="Enter"||e.key==="ArrowRight")&&r.picks[id]!==undefined&&document.activeElement?.id!=="prev"){e.preventDefault();next()}
});
$("#missed-only").addEventListener("change",e=>{S.missedOnly=e.target.checked;save();renderSettings()});
$("#start").addEventListener("click",()=>newRound());
function resetUI(){
  const w=$("#reset-wrap");w.textContent="";
  w.append(el("span",{class:"confirm"},"Clear all saved answers?",
    el("button",{class:"danger",id:"reset-yes",onclick:()=>{S.hist={};S.missedOnly=false;newRound();restoreReset()}},"Clear"),
    el("button",{id:"reset-no",onclick:restoreReset},"Cancel")));
}
function restoreReset(){const w=$("#reset-wrap");w.textContent="";w.append(el("button",{class:"linkish",id:"reset",onclick:resetUI},"Reset saved progress"))}
$("#reset").addEventListener("click",resetUI);
if(window.innerWidth>700)$("#settings").open=true;

/* pleth waveform */
(function(){let d="M0 28";const w=70;for(let x=0;x<700;x+=w){d+=` C${x+8} 28 ${x+12} 4 ${x+20} 4 S${x+28} 16 ${x+32} 17 S${x+38} 12 ${x+42} 14 S${x+56} 28 ${x+w} 28`}$("#pleth-path").setAttribute("d",d)})();

if(!S.round||!S.round.ids||S.round.ids.some(id=>!BANK[id]))newRound();else render();
</script>

</body>
</html>
